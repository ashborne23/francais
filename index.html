<script>
/* storage shim: uses Claude's storage when embedded, localStorage when standalone,
   memory as a last resort (e.g. file:// on iOS, where WebKit may block localStorage) */
(function(){
  if(window.storage&&typeof window.storage.get==="function"){window.__mode="claude";return;}
  var mem={},LS=null;
  try{var t="__probe";localStorage.setItem(t,"1");localStorage.removeItem(t);LS=localStorage;}catch(e){LS=null;}
  window.__mode=LS?"local":"memory";
  window.storage={
    get:function(k){return new Promise(function(res,rej){
      var v=LS?LS.getItem(k):mem[k];
      if(v===null||v===undefined)rej(new Error("not found"));else res({key:k,value:v});});},
    set:function(k,v){return new Promise(function(res){if(LS)LS.setItem(k,v);else mem[k]=v;res({key:k,value:v});});},
    delete:function(k){return new Promise(function(res){if(LS)LS.removeItem(k);else delete mem[k];res({key:k,deleted:true});});},
    list:function(){return new Promise(function(res){res({keys:LS?Object.keys(LS):Object.keys(mem)});});}
  };
})();
</script>

<style>
:root{
  --paper:#FCFCF8;
  --card:#FFFFFF;
  --seyes:#C3D0EA;
  --seyes-soft:#E4EAF6;
  --margin:#DE8891;
  --bic:#2B3A8C;
  --ink:#18192B;
  --muted:#6C7180;
  --rule:#E2E2D9;
  --rule-2:#C8CABF;
  --vert:#2C7A57;
  --rouge:#B3323F;
  --or:#B8892B;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
#app{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;border:1px solid var(--rule-2);-webkit-font-smoothing:antialiased}
#app *,#app *::before,#app *::after{box-sizing:border-box}
.boot{padding:60px 20px;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fr{font-family:var(--serif)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}

/* header on Seyès-ruled paper */
.head{
  position:relative;padding:22px 24px 20px 40px;background:
    linear-gradient(var(--seyes-soft) 1px,transparent 1px) 0 0/100% 22px,
    var(--card);
  border-bottom:1px solid var(--rule-2);overflow:hidden;
}
.head::before{content:"";position:absolute;left:26px;top:0;bottom:0;width:1.5px;background:var(--margin)}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;position:relative}
.title{font-family:var(--serif);font-size:27px;line-height:1.1;letter-spacing:-.01em;margin:2px 0 4px}
.sub{font-size:12.5px;color:var(--muted)}
.now{text-align:right}
.now-lvl{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--bic);line-height:1;letter-spacing:-.02em}
.now-note{font-size:11px;color:var(--muted);margin-top:3px}

/* ladder */
.ladder{display:flex;gap:2px;margin-top:16px;position:relative}
.rung{flex:1;min-width:0}
.rung-bar{height:9px;background:#E8E8E0;position:relative;overflow:hidden}
.rung-fill{position:absolute;inset:0 auto 0 0;background:var(--bic);opacity:.85}
.rung.done .rung-fill{background:var(--vert)}
.rung-cap{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em}
.rung-cap b{color:var(--ink);font-weight:600}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule-2);background:var(--card);overflow-x:auto}
.tab{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:12px 16px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--bic);border-bottom-color:var(--bic)}
.pane{padding:20px 24px}
.pane[hidden]{display:none}

h3.sec{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
h3.sec + .sec-note{margin-top:-6px}
.sec-note{font-size:12px;color:var(--muted);margin:0 0 12px}
.hr{height:1px;background:var(--rule);margin:22px 0}

/* today */
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:24px}
.timer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tcell{border:1px solid var(--rule);background:var(--card);padding:9px 8px 10px;text-align:center}
.tcell .lbl{display:block;margin-bottom:6px;font-size:9px;letter-spacing:.08em}
.tcell input{width:100%;font-family:var(--mono);font-size:16px;text-align:center;border:0;border-bottom:1px solid var(--rule-2);padding:2px 0 3px;background:none;color:var(--ink)}
.tcell.out{background:#FBF7F0;border-color:#E8DCC6}
.tcell.out .lbl{color:var(--or)}
.dayline{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.prog{flex:1;min-width:160px;height:22px;background:#EDEDE5;position:relative;border:1px solid var(--rule-2)}
.prog-fill{position:absolute;inset:0 auto 0 0;background:var(--bic);opacity:.8}
.prog-txt{position:relative;font-family:var(--mono);font-size:10.5px;line-height:20px;padding-left:8px;color:var(--ink);mix-blend-mode:normal}
button{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
button:hover{background:var(--bic);border-color:var(--bic)}
button.ghost{background:none;color:var(--ink);border-color:var(--rule-2)}
button.ghost:hover{background:#F0F0EA;color:var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible,.tab:focus-visible{outline:2px solid var(--bic);outline-offset:2px}
.flash{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--vert);opacity:0;transition:opacity .3s}
.flash.on{opacity:1}

.plan{border-left:2px solid var(--margin);padding-left:14px}
.plan-item{display:flex;gap:10px;margin-bottom:11px;align-items:baseline}
.plan-min{font-family:var(--mono);font-size:11px;color:var(--bic);flex:none;width:42px}
.plan-body{font-size:13px}
.plan-body a{color:var(--bic)}
.plan-body .d{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}

/* streak strip */
.strip{display:flex;gap:2px;margin-top:8px}
.sq{flex:1;aspect-ratio:1;background:#EAEAE2;min-width:0}
.sq[data-f="1"]{background:#C9D6EF}
.sq[data-f="2"]{background:#8FA6DB}
.sq[data-f="3"]{background:var(--bic)}
.sq.today{outline:1.5px solid var(--rouge);outline-offset:-1.5px}

/* units */
.unit{border:1px solid var(--rule);background:var(--card);margin-bottom:9px}
.unit-h{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
.unit-n{font-family:var(--mono);font-size:10px;color:var(--muted);width:26px;flex:none}
.unit-t{flex:1;font-size:13.5px}
.unit-t .fr{color:var(--bic)}
.unit-lv{font-family:var(--mono);font-size:9.5px;border:1px solid var(--rule-2);padding:1px 5px;color:var(--muted)}
.unit-body{padding:0 13px 14px 39px;border-top:1px solid var(--rule);padding-top:12px}
.unit-body[hidden]{display:none}
.res{display:block;padding:7px 0;border-bottom:1px dotted var(--rule);font-size:12.5px}
.res:last-of-type{border-bottom:0}
.res a{color:var(--bic);text-decoration:none;border-bottom:1px solid rgba(43,58,140,.3)}
.res a:hover{border-bottom-color:var(--bic)}
.res .t{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:7px}
.res .d{color:var(--muted);font-size:11.5px}
.task{margin-top:11px;padding:10px 12px;background:#FBF7F0;border-left:2px solid var(--or);font-size:12.5px}
.task .lbl{color:var(--or);display:block;margin-bottom:3px}

/* practice */
.q{border:1px solid var(--rule-2);background:var(--card);padding:18px;max-width:620px}
.q-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;align-items:baseline}
.q-txt{font-family:var(--serif);font-size:19px;line-height:1.45;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;font-family:var(--serif);font-size:15px;text-transform:none;letter-spacing:0;padding:10px 13px;margin-bottom:6px;background:var(--card);color:var(--ink);border:1px solid var(--rule-2)}
.opt:hover{background:#F2F4FA;border-color:var(--bic);color:var(--ink)}
.opt.right{background:#EAF5EF;border-color:var(--vert);color:#1D5A3E}
.opt.wrong{background:#FBEDEE;border-color:var(--rouge);color:#8A2530}
.expl{margin-top:12px;padding:11px 13px;background:#F5F6F2;border-left:2px solid var(--bic);font-size:13px}
.expl b{font-family:var(--serif)}
.score{display:flex;gap:20px;margin-bottom:14px;flex-wrap:wrap}
.score div span{font-family:var(--mono);font-size:19px;display:block;font-weight:600}

.qlinks{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px dotted var(--rule-2)}
.qlinks a{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--bic);text-decoration:none;border-bottom:1px solid rgba(43,58,140,.35)}
.qlinks a:hover{border-bottom-color:var(--bic)}
.drillbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:10px 12px;margin-bottom:16px;background:var(--card);border:1px solid var(--rule)}
.drillbar a{font-size:12.5px;color:var(--bic);text-decoration:none;border-bottom:1px solid rgba(43,58,140,.3)}
.drillbar a:hover{border-bottom-color:var(--bic)}
@media(hover:none){.qlinks a,.drillbar a{padding:6px 0;display:inline-block}}
/* diagnostics */
.bars{max-width:640px}
.brow{display:grid;grid-template-columns:1fr 118px 46px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--rule)}
.bname{font-size:12.5px}
.btrack{height:7px;background:#EAEAE2}
.bfill{height:100%;background:var(--vert)}
.bfill.low{background:var(--rouge)}
.bfill.mid{background:var(--or)}
.bpct{font-family:var(--mono);font-size:11px;text-align:right;color:var(--muted)}
.callout{border:1px solid var(--rule-2);border-left:3px solid var(--rouge);background:var(--card);padding:13px 15px;margin-bottom:10px;font-size:13px}
.callout b{color:var(--rouge)}
.callout.ok{border-left-color:var(--vert)}
.callout.ok b{color:var(--vert)}

/* media */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.m{border:1px solid var(--rule);background:var(--card);padding:11px 12px}
.m-t{font-family:var(--serif);font-size:14.5px;line-height:1.25}
.m-t a{color:var(--bic);text-decoration:none;border-bottom:1px solid rgba(43,58,140,.3)}
.m-t a:hover{border-bottom-color:var(--bic)}
.m:hover{border-color:var(--rule-2);box-shadow:0 1px 0 var(--rule-2)}
.m-meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--muted);margin:4px 0 6px;text-transform:uppercase}
.m-d{font-size:12px;color:var(--muted);line-height:1.4}
.mlinks{display:flex;gap:11px;flex-wrap:wrap;margin-top:9px;padding-top:8px;border-top:1px dotted var(--rule)}
.mlinks a{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--bic);text-decoration:none;border-bottom:1px solid rgba(43,58,140,.3)}
.mlinks a:hover{border-bottom-color:var(--bic)}
@media(hover:none){.mlinks a{padding:6px 0;display:inline-block}}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:5px 10px;border:1px solid var(--rule-2);background:var(--card);color:var(--muted);cursor:pointer;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--bic);color:#fff;border-color:var(--bic)}
.foot{font-size:11.5px;color:var(--muted);line-height:1.55}

.fwrap{display:flex;flex-wrap:wrap;gap:5px;max-width:820px}
.fw{font-family:var(--serif);font-size:14.5px;padding:5px 9px;border:1px solid var(--rule-2);background:var(--card);cursor:pointer;user-select:none;line-height:1.2}
.fw:hover{border-color:var(--bic);color:var(--bic)}
.fw.sp{border-bottom:2px solid var(--or)}
.fw.wr{border-bottom:2px solid var(--bic)}
.fw.kn{background:#EAF5EF;border-color:#9CCBB2;color:#1D5A3E}
.rg{font-family:var(--mono);font-size:10px;padding:1px 5px;border-bottom-width:2px;border-bottom-style:solid}
.rg.s{border-bottom-color:var(--or);color:var(--or)}
.rg.w{border-bottom-color:var(--bic);color:var(--bic)}
@media(hover:none){.fw{padding:9px 12px;font-size:16px}}
/* vocabulary */
.vcard{text-align:center}
.vfr{font-family:var(--serif);font-size:31px;line-height:1.25;color:var(--bic);margin:18px 0}
.ven{font-size:17px;margin-bottom:10px}
.vex{font-size:15px;color:var(--muted);padding:10px 12px;background:#F5F6F2;border-left:2px solid var(--seyes);text-align:left}
.vbtns{display:flex;gap:8px;justify-content:center;margin-top:18px}
.vlist{border-top:1px solid var(--rule);max-width:760px}
.vrow{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px dotted var(--rule)}
.vw{font-size:15px;color:var(--bic)}
.vg{font-size:12.5px;color:var(--muted)}
.vex2{display:block;font-size:12.5px;color:var(--ink);opacity:.7;margin-top:3px}
.vbox{font-family:var(--mono);font-size:11px;color:#C4C7BC;letter-spacing:1px;flex:none}
.vbox.mid{color:var(--or)}
.vbox.ok{color:var(--vert)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;max-width:760px}
.addrow input{flex:1 1 170px;font-family:var(--serif);font-size:14px;padding:9px 10px;border:1px solid var(--rule-2);background:var(--card);color:var(--ink)}
.bump{display:flex;gap:4px;justify-content:center;margin-top:7px}
button.tiny{padding:5px 8px;font-size:11px;letter-spacing:0;min-width:34px;background:var(--card);color:var(--muted);border-color:var(--rule-2)}
button.tiny:hover{background:var(--bic);color:#fff;border-color:var(--bic)}
.unit.is-done .unit-t{opacity:.55}
.unit.is-done .unit-n{color:var(--vert);font-weight:700}
@media(hover:none){
  button,.chip,.tab{min-height:44px}
  button.tiny{min-height:38px;min-width:44px;font-size:13px}
  .opt{padding:13px 14px}
  .unit-h{padding:14px 13px}
  .tcell input{font-size:19px;padding:6px 0}
  .res{padding:10px 0}
  .res a{padding:2px 0;display:inline-block}
}
@media(min-width:761px) and (max-width:1100px){
  .grid2{grid-template-columns:1fr;gap:22px}
  .timer-grid{grid-template-columns:repeat(5,1fr)}

}
@media(max-width:760px){
  .grid2{grid-template-columns:1fr;gap:20px}
  .timer-grid{grid-template-columns:repeat(3,1fr)}
  .pane{padding:16px}
  .head{padding:18px 16px 16px 32px}
  .now{text-align:left}
  .head-row{gap:10px}
}
@media(prefers-reduced-motion:reduce){#app *{transition:none!important}}


.tbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 16px;margin-top:14px;border:1px solid var(--rule-2);background:var(--card)}
.tbar-s{font-size:12px;color:var(--muted)}
.tbar-s.warn{color:var(--rouge)}
.tbar-b{display:flex;gap:8px;align-items:center}
.tbar-b input[type=email],.tbar-b input[type=password]{font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--rule-2);background:var(--card);color:var(--ink);min-width:150px}
#syncbar code{font-family:var(--mono);font-size:11px;background:#EFEFE9;padding:1px 4px}

  padding:9px 13px;border:1px solid var(--rule-2);background:var(--card);color:var(--ink);cursor:pointer}

@media(hover:none){.tbar button{min-height:44px}}
body{margin:0;padding:16px;background:#EFEFE9}

<body>
<div class="wrap">
<div id="app"><div class="boot">Ouverture du cahier…</div></div>

<div class="tbar">
  <span class="tbar-s" id="tb-status">…</span>
  <span class="tbar-b">
    <button type="button" id="tb-exp">Export backup</button>
    <button type="button" id="tb-imp-btn">Import backup</button>
    <input type="file" id="tb-imp" accept="application/json,.json" style="display:none">
  </span>
</div>
<div class="tbar" id="syncbar"></div>
<script>
(function(){
  var K="french_lab_v1", BK="french_lab_lastbackup";
  var st=document.getElementById("tb-status");

  function read(){ try{ return localStorage.getItem(K); }catch(e){ return null; } }

  function summarise(){
    var raw=read();
    if(window.__mode==="memory"){
      st.className="tbar-s warn";
      st.textContent="Not saving — this page was opened as a local file. Export before you close the tab.";
      return;
    }
    if(window.__mode==="claude"){
      st.className="tbar-s";
      st.textContent="Saving to your Claude account.";
      return;
    }
    st.className="tbar-s";
    if(!raw){ st.textContent="Ready. This device will remember your progress."; return; }
    var d;
    try{ d=JSON.parse(raw); }catch(e){ st.textContent="Saving on this device."; return; }
    var mins=0, days=0;
    Object.keys(d.log||{}).forEach(function(k){
      var e=d.log[k], m=(e.l||0)+(e.r||0)+(e.g||0)+(e.s||0)+(e.w||0);
      if(m>0){ days++; mins+=m; }
    });
    var cards=Object.keys(d.voc||{}).length;
    var known=Object.keys(d.known||{}).filter(function(w){return d.known[w];}).length;
    var bits=[];
    if(mins) bits.push((mins/60).toFixed(1)+" h over "+days+" day"+(days===1?"":"s"));
    if(cards) bits.push(cards+" card"+(cards===1?"":"s")+" started");
    if(known) bits.push(known+" words marked known");
    var last=null; try{ last=localStorage.getItem(BK); }catch(e){}
    var tail = last
      ? " · last backup "+new Date(last).toLocaleDateString(undefined,{day:"2-digit",month:"short"})
      : (bits.length ? " · no backup yet" : "");
    st.textContent = "Saved on this device" + (bits.length ? " · "+bits.join(" · ") : "") + tail;
  }

  summarise();

  document.getElementById("tb-exp").onclick=function(){
    var raw=read();
    if(!raw){ alert("Nothing saved yet — log a day or review a card first."); return; }
    var blob=new Blob([raw],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="french-lab-backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    try{ localStorage.setItem(BK, new Date().toISOString()); }catch(e){}
    summarise();
  };
  document.getElementById("tb-imp-btn").onclick=function(){ document.getElementById("tb-imp").click(); };
  document.getElementById("tb-imp").onchange=function(ev){
    var f=ev.target.files&&ev.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var incoming=JSON.parse(r.result);
        var cur=read();
        if(cur && !confirm("This will replace the progress already saved on this device. Continue?")) return;
        localStorage.setItem(K, JSON.stringify(incoming));
        location.reload();
      }catch(e){ alert("That file could not be read as a backup."); }
    };
    r.readAsText(f);
  };
})();
</script>

<script>
(function(){
const KEY="french_lab_v1";
const START="2026-07-28";

/* ---------------- resource library ---------------- */

function totals(){let all=0,out=0;Object.keys(S.log).forEach(d=>{const e=S.log[d];KINDS.forEach(([k,,f])=>{all+=e[k]||0;if(f==="out")out+=e[k]||0})});return{h:all/60,outRatio:all?out/all:null,all}}
function topicAcc(){const o={};Object.entries(S.quiz).forEach(([t,v])=>{const n=v.r+v.w;if(n>=3)o[t]=v.r/n});return o}
function levelAcc(lv){let r=0,w=0;Object.entries(S.quiz).forEach(([t,v])=>{if(t.startsWith(lv)){r+=v.r;w+=v.w}});return{n:r+w,acc:(r+w)?r/(r+w):0}}

const BASE={A1:0,A2:90};
function effH(){return totals().h+(BASE[S.startLv]||0)}
function estimate(){
 const h=effH();let idx=S.startLv==="A2"?0:-1;
 for(let i=idx+1;i<LEVELS.length;i++){
   const L=LEVELS[i],a=levelAcc(L.n);
   if(h>=L.h&&a.n>=12&&a.acc>=0.75)idx=i;else break;
 }
 const nextL=LEVELS[Math.min(idx+1,3)];
 const prevH=idx<0?0:LEVELS[idx].h;
 const pct=Math.min(100,Math.round(((h-prevH)/(nextL.h-prevH))*100));
 return{idx,label:idx<0?"A0":LEVELS[idx].n,working:nextL.n,pct:Math.max(0,pct),hours:h};
}

 return `<h3 class="sec">Films, séries, musique — graded</h3>
 <p class="sec-note">Watch one level below where you think you are. Subtitles in French, not English — English subtitles turn listening practice into reading practice.</p>
 <div class="filters">${["ALL","A1","A2","B1","B2"].map(f=>`<button class="chip" data-m="${f}" aria-pressed="${mFilter===f}">${f}</button>`).join("")}</div>
 <div class="mgrid">
 ${MEDIA.filter(m=>mFilter==="ALL"||m.lv===mFilter).map(m=>`<div class="m">
   <div class="m-t"><a href="${mPrimary(m)}" target="_blank" rel="noopener">${esc(m.t)}</a></div>
   <div class="m-meta">${m.lv} · ${esc(m.k)}</div>
   <div class="m-d">${esc(m.d)}</div>
   ${mLinks(m)}</div>`).join("")}
 </div>
 <div class="hr"></div>
 <div class="res"><span class="t">Drills</span><a href="${R.lyrics.u}" target="_blank" rel="noopener">${R.lyrics.t}</a><span class="d"> — ${R.lyrics.d}</span></div>
 <div class="res"><span class="t">Listening</span><a href="${R.inner.u}" target="_blank" rel="noopener">${R.inner.t}</a><span class="d"> — ${R.inner.d}</span></div>
 <div class="res"><span class="t">Listening</span><a href="${R.coffee.u}" target="_blank" rel="noopener">${R.coffee.t}</a><span class="d"> — ${R.coffee.d}</span></div>
 <div class="res"><span class="t">Video</span><a href="${R.easy.u}" target="_blank" rel="noopener">${R.easy.t}</a><span class="d"> — ${R.easy.d}</span></div>
 <div class="res"><span class="t">Video</span><a href="${R.piece.u}" target="_blank" rel="noopener">${R.piece.t}</a><span class="d"> — ${R.piece.d}</span></div>
 <div class="res"><span class="t">Video</span><a href="${R.arte.u}" target="_blank" rel="noopener">${R.arte.t}</a><span class="d"> — ${R.arte.d}</span></div>`;
}

function paneProgress(){
 const t=totals(),e=estimate(),acc=topicAcc();
 const rows=Object.entries(acc).sort((a,b)=>a[1]-b[1]);
 const days=Object.keys(S.log).filter(d=>mins(d)>0).length;
 const elapsed=Math.max(1,dbet(START,today())+1);
 const rate=t.all/60/elapsed;
 const nextL=LEVELS[Math.min(e.idx+1,3)];
 const need=Math.max(0,nextL.h-t.h);
 const eta=rate>0?shift(today(),Math.ceil(need/rate)):null;
 const out=[];

 if(t.outRatio!==null&&t.outRatio<0.25&&t.all>180)
   out.push(`<div class="callout"><b>Output is low.</b> ${Math.round(t.outRatio*100)}% of your minutes are speaking or writing. Below 25%, comprehension climbs and production stalls — which is exactly the gap your first test showed.</div>`);
 else if(t.outRatio!==null&&t.outRatio>=0.25)
   out.push(`<div class="callout ok"><b>Output ratio healthy.</b> ${Math.round(t.outRatio*100)}% of minutes are production.</div>`);
 if(rate>0&&rate<1.2&&elapsed>6)
   out.push(`<div class="callout"><b>Run rate is ${rate.toFixed(1)} h/day</b> against a 2 h plan. At this pace ${nextL.n} lands around ${eta?fmt(eta):"—"}. Not a problem — just don't plan against the 2 h number if you're living at ${rate.toFixed(1)}.</div>`);
 rows.slice(0,3).forEach(([topic,a])=>{if(a<0.7)
   out.push(`<div class="callout"><b>Lagging: ${esc(topic)}</b> — ${Math.round(a*100)}% correct. Look this one up on <a href="${R.law.u}" target="_blank" rel="noopener" style="color:var(--bic)">Lawless French</a> and drill it on <a href="${R.ff.u}" target="_blank" rel="noopener" style="color:var(--bic)">Français Facile</a>.</div>`)});
 if(!out.length)out.push(`<div class="callout ok"><b>Not enough data yet.</b> Log a few days and answer 15–20 drill questions — the diagnosis needs both hours and accuracy to say anything honest.</div>`);

 return `<h3 class="sec">Where you stand</h3>
 <div class="score" style="margin-bottom:18px">
   <div><span class="lbl">Hours</span><span>${t.h.toFixed(1)}</span></div>
   <div><span class="lbl">Days active</span><span>${days}/${elapsed}</span></div>
   <div><span class="lbl">Run rate</span><span>${rate.toFixed(1)}</span></div>
   <div><span class="lbl">Output</span><span>${t.outRatio===null?"—":Math.round(t.outRatio*100)+"%"}</span></div>
   <div><span class="lbl">To ${nextL.n}</span><span>${need.toFixed(0)}h</span></div>
 </div>
 ${out.join("")}
 <div class="hr"></div>
 <h3 class="sec">Accuracy by topic</h3>
 <p class="sec-note">Only topics with 3+ answers appear. Weakest first.</p>
 <div class="bars">
 ${rows.length?rows.map(([topic,a])=>`<div class="brow">
   <span class="bname">${esc(topic)}</span>
   <span class="btrack"><span class="bfill ${a<0.6?"low":a<0.8?"mid":""}" style="width:${Math.round(a*100)}%"></span></span>
   <span class="bpct">${Math.round(a*100)}%</span></div>`).join(""):`<p class="foot">Nothing yet — go drill.</p>`}
 </div>
 <div class="hr"></div>
 <p class="foot"><b>How the level estimate works.</b> A level is credited only when you clear both gates: the CEFR hour benchmark (A1 90h, A2 200h, B1 400h, B2 650h cumulative) <em>and</em> 75%+ accuracy across at least 12 drill questions at that level. Hours without accuracy means time spent, not level gained; accuracy without hours means you've learned rules you can't yet use at speed.<br><br>
 <b>Starting at A2</b> credits you the 90 hours that A1 normally takes, so the ladder begins part-filled and your next real milestone is A2 at 200 cumulative hours — about 110 logged hours away, or roughly two months at 2 h/day. B1 then lands around March 2027 and B2 in late 2027. The credit is an assumption about what you already know, and the A2 drills are what test it: if accuracy there sits under 70% after 20 questions, the assumption was wrong and you should switch the start level back to A1.<br><br>
 The only unbiased check is a <a href="${R.delf.u}" target="_blank" rel="noopener" style="color:var(--bic)">DELF past paper</a>. Sit A1 in September and A2 in December — this tracker estimates, the exam decides.</p>`;
}
function fmt(s){return new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}

/* ---------- events ---------- */
function wire(){
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mFilter=b.dataset.m;render()});
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{uFilter=b.dataset.u;render()});
 document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{qFilter=b.dataset.q;cur=null;render()});
 document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{S.startLv=b.dataset.start;uFilter=b.dataset.start;qFilter=b.dataset.start;save();render()});
 document.querySelectorAll("[data-done]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();const i=b.dataset.done;S.done[i]=!S.done[i];save();render()});
 document.querySelectorAll("[data-bump]").forEach(b=>b.onclick=()=>{
   const inp=document.querySelector(`[data-k="${b.dataset.bump}"]`);
   inp.value=Math.max(0,(parseInt(inp.value,10)||0)+parseInt(b.dataset.by,10));
 });
 document.querySelectorAll("[data-vmode]").forEach(b=>b.onclick=()=>{vMode=b.dataset.vmode;render()});
 document.querySelectorAll("[data-band]").forEach(b=>b.onclick=()=>{vBand=+b.dataset.band;render()});
 const fw=document.getElementById("freqwrap");
 if(fw){
   const hit=el=>{if(!el||!el.dataset.w)return;const w=el.dataset.w;
     S.known[w]=!S.known[w];el.classList.toggle("kn",!!S.known[w]);save();
     const c=document.getElementById("kc");if(c)c.textContent=knownCount()+" / 5000";};
   fw.onclick=ev=>hit(ev.target.closest(".fw"));
   fw.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();hit(ev.target.closest(".fw"))}};
 }
 document.querySelectorAll("[data-vlv]").forEach(b=>b.onclick=()=>{vLv=b.dataset.vlv;render()});
 document.querySelectorAll("[data-vth]").forEach(b=>b.onclick=()=>{vTheme=b.dataset.vth;render()});
 const vs=document.getElementById("v-start");
 if(vs)vs.onclick=()=>{vMode="review";pickCard();render()};
 const vst=document.getElementById("v-stop");
 if(vst)vst.onclick=()=>{vMode="browse";render()};
 const vsh=document.getElementById("v-show");
 if(vsh)vsh.onclick=()=>{vShown=true;render()};
 const vok=document.getElementById("v-ok");
 if(vok)vok.onclick=()=>{gradeCard(true);pickCard();render()};
 const vag=document.getElementById("v-again");
 if(vag)vag.onclick=()=>{gradeCard(false);pickCard();render()};
 const vad=document.getElementById("v-add");
 if(vad)vad.onclick=()=>{
   const fr=document.getElementById("v-fr").value.trim(),en=document.getElementById("v-en").value.trim(),ex=document.getElementById("v-ex").value.trim();
   if(!fr||!en)return;
   S.mine.push({fr,en,ex,lv:vLv==="ALL"?"A2":vLv});vTheme="Mes mots";save();render();
 };
 const ud=document.getElementById("unit-done");
 if(ud)ud.onclick=()=>{const {i}=firstUnit();S.done[i]=true;save();render()};
 document.querySelectorAll("[data-unit]").forEach(h=>{
   const go=()=>{const i=h.dataset.unit;S.open[i]=!S.open[i];save();render()};
   h.onclick=go;h.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();go()}};
 });
 const sd=document.getElementById("save-day");
 if(sd)sd.onclick=()=>{const e={};document.querySelectorAll("[data-k]").forEach(i=>{e[i.dataset.k]=Math.max(0,parseInt(i.value,10)||0)});S.log[today()]=e;save();render()};
 const st=document.getElementById("start-q");
 if(st)st.onclick=()=>{pickQ();document.getElementById("qbox").innerHTML=renderQ();wireQ()};
 wireQ();
}
function wireQ(){
 document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
   if(answered)return;answered=true;
   const q=Q[cur],pick=+b.dataset.opt,ok=pick===q[3];
   document.querySelectorAll("[data-opt]").forEach((x,i)=>{if(i===q[3])x.classList.add("right");else if(i===pick)x.classList.add("wrong")});
   const rec=S.quiz[q[0]]||{r:0,w:0};ok?rec.r++:rec.w++;S.quiz[q[0]]=rec;save();
   document.getElementById("expl").innerHTML=`<div class="expl"><b>${ok?"Oui.":"Non — "+esc(q[2][q[3]])+"."}</b> ${esc(q[4])}${lessonLinks(q[0])}</div>
     <button id="next-q" style="margin-top:12px">Next question</button>
     <button class="ghost" id="stop-q" style="margin-top:12px;margin-left:6px">Done</button>`;
   document.getElementById("next-q").onclick=()=>{pickQ();document.getElementById("qbox").innerHTML=renderQ();wireQ()};
   document.getElementById("stop-q").onclick=()=>{cur=null;render()};
 });
}
load().then(render);
})();
